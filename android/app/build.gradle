plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.uniconnect'
    compileSdk 34

    defaultConfig {
        applicationId "com.uniconnect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            // applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "BASE_URL", '"https://api.uniconnect/v1/"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://api.uniconnect/v1/"'
            signingConfig signingConfigs.debug // replace with release signing in prod
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Prevent duplicate file errors from transitive dependencies
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    // ── AndroidX Core ──────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ── Material Design 3 ──────────────────────────────────────
    implementation 'com.google.android.material:material:1.12.0'

    // ── RecyclerView ───────────────────────────────────────────
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ── Lifecycle: ViewModel + LiveData ────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.2'

    // ── Navigation Component ───────────────────────────────────
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ── Retrofit + OkHttp ──────────────────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ── Gson ───────────────────────────────────────────────────
    implementation 'com.google.code.gson:gson:2.11.0'

    // ── Glide (image loading) ──────────────────────────────────
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ── Google Play Services: Location ────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ── Google Sign-In ─────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // ── Firebase (needed for google-services plugin) ───────────
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    // Add firebase-auth only if you use Firebase Auth; otherwise remove
    // implementation 'com.google.firebase:firebase-auth'

    // ── JWT decode (client-side token inspection) ─────────────
    implementation 'com.auth0.android:jwtdecode:2.0.2'

    // ── Shimmer loading placeholder ────────────────────────────
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // ── FlexboxLayout (for chip wrapping) ──────────────────────
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // ── CircleImageView (avatars) ──────────────────────────────
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // ── Testing ────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
